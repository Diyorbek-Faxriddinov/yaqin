name: Zaxira

# deploy/backup skriptlari haqiqiy serverdagidek sinaladi: compose'dagi baza (PostGIS), rasmlar
# volume'i, restic va ikki xil repozitoriy — S3 (rclone serve s3, Servercore S3 o'rnida) va server
# diskidagi papka (S3 Toshkentda hali yo'q — vaqtinchalik, kompyuterga nusxa bilan). To'liq sikl: install.sh
# (restic init, systemd taymerlari) → backup.sh → baza o'zgaradi → restore-test.sh zaxira vaqtidagi
# holatni tiklaydi va solishtiradi → buzilgan zaxira aniqlanadi → healthcheck.sh.

on:
  push:
    branches: [main]
    paths:
      - "deploy/backup/**"
      - "deploy/compose.yaml"
      - ".github/workflows/backup.yml"
  pull_request:
    paths:
      - "deploy/backup/**"
      - "deploy/compose.yaml"
      - ".github/workflows/backup.yml"

permissions:
  contents: read

concurrency:
  group: backup-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: deploy

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repository:
          - s3:http://127.0.0.1:9000/yaqin-backup/yaqin
          - /var/backups/restic
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck -x backup/*.sh

      - name: restic va S3 (rclone serve s3)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq restic
          restic version
          docker run -d --name s3 -p 127.0.0.1:9000:9000 rclone/rclone:1.75.2 \
            serve s3 --auth-key ci-access,ci-secret-key --addr :9000 /data
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done

      - name: .env va baza (faqat db, sinov maʼlumoti bilan)
        run: |
          cat > .env <<EOF
          SITE_DOMAIN=localhost
          SITE_URL=http://localhost
          SITE_ADDRESS=http://localhost
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          DATABASE_PASSWORD=$(openssl rand -hex 24)
          DJANGO_SECRET_KEY=$(openssl rand -hex 32)
          TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')
          REVALIDATE_SECRET=$(openssl rand -hex 24)
          BACKUP_REPOSITORY=${{ matrix.repository }}
          BACKUP_S3_ACCESS_KEY=ci-access
          BACKUP_S3_SECRET_KEY=ci-secret-key
          BACKUP_S3_REGION=us-east-1
          EOF
          docker compose up -d --wait db
          docker compose exec -T db psql -U postgres -d yaqin -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE business (id serial PRIMARY KEY, name text, location geography(Point, 4326));
          INSERT INTO business (name, location)
            SELECT 'Biznes ' || i, ST_MakePoint(69.2 + i / 1000.0, 41.3)::geography FROM generate_series(1, 250) i;
          CREATE TABLE review (id serial PRIMARY KEY, business_id int REFERENCES business, text text);
          INSERT INTO review (business_id, text) SELECT 1 + i % 250, 'Sharh ' || i FROM generate_series(1, 1000) i;
          SQL
          docker volume create yaqin_media
          docker run --rm -v yaqin_media:/m alpine:3.22 sh -c \
            'mkdir -p /m/businesses /m/items && for i in 1 2 3 4 5; do head -c 200000 /dev/urandom > /m/businesses/$i.webp; done && head -c 50000 /dev/urandom > /m/items/a.webp'

      - name: install.sh (restic init, BACKUP_PASSWORD, systemd)
        run: |
          sudo backup/install.sh
          grep -qE '^BACKUP_PASSWORD=[0-9a-f]{64}$' .env
          systemctl is-enabled yaqin-backup.timer yaqin-healthcheck.timer yaqin-requests.timer yaqin-restore-test.timer
          # Qayta ishga tushirish xavfsiz: parol va repozitoriy o'zgarmaydi
          before=$(grep '^BACKUP_PASSWORD=' .env)
          sudo backup/install.sh
          test "$before" = "$(grep '^BACKUP_PASSWORD=' .env)"

      - name: Zaxira
        run: sudo backup/backup.sh

      - name: Baza zaxiradan keyin o'zgaradi (sinov zaxira vaqtidagi holatni solishtirishi kerak)
        run: docker compose exec -T db psql -U postgres -d yaqin -c "INSERT INTO review (business_id, text) VALUES (1, 'Keyin');"

      - name: Tiklash sinovi
        run: sudo backup/restore-test.sh

      - name: Ikkinchi zaxira (faqat o'zgargani yuboriladi) va saqlash qoidasi
        run: |
          sudo backup/backup.sh
          sudo bash -c 'source backup/lib.sh && restic_env && restic snapshots --host yaqin'

      - name: Lokal repozitoriy — .env egasi o'qiy oladi, nusxasi to'liq repozitoriy
        if: startsWith(matrix.repository, '/')
        run: |
          # Kompyuterdagi nusxa (backup-copy.ps1) server bilan deploy (.env egasi) huquqida ishlaydi
          test -z "$(find /var/backups/restic ! -readable)"
          cp -r /var/backups/restic /tmp/pc-copy
          password=$(sed -n 's/^BACKUP_PASSWORD=//p' .env)
          RESTIC_PASSWORD=$password restic -r /tmp/pc-copy snapshots
          RESTIC_PASSWORD=$password restic -r /tmp/pc-copy check --read-data

      - name: Buzilgan zaxira aniqlanadi
        run: |
          # Zaxiradagi qatorlar sonini soxtalashtiramiz: tiklash sinovi yiqilishi shart
          sudo sed -i 's/^review\t.*/review\t999999/' /var/backups/yaqin/counts.tsv
          sudo bash -c 'source backup/lib.sh && restic_env && restic backup --host yaqin --tag daily /var/backups/yaqin "$(media_path)" >/dev/null'
          if sudo backup/restore-test.sh; then echo "Buzilgan zaxira o'tib ketdi"; exit 1; fi

      - name: healthcheck.sh (CI'da faqat baza bor — qolgan konteynerlar muammo deb chiqishi kerak)
        run: |
          out=$(sudo backup/healthcheck.sh)
          echo "$out"
          grep -q 'konteyner backend ishlamayapti' <<<"$out"
          grep -q 'sertifikat' <<<"$out"
          # Holat o'zgarmasa — qayta xabar yo'q (faqat ro'yxat chiqadi), holat fayli saqlangan
          sudo test -s /var/lib/yaqin/health-state

      - name: Yangi biznes so'rovlari — xabarda shaxsiy maʼlumot yo'q, takrorlanmaydi
        run: |
          # Taymer sinovdan oldin ishlab ulgurmasin; jadvallar — productiondagi ustunlar bilan
          sudo systemctl stop yaqin-requests.timer
          sudo rm -f /var/lib/yaqin/requests-since
          docker compose exec -T db psql -U postgres -d yaqin -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE catalog_district (id uuid PRIMARY KEY, name_uz text);
          INSERT INTO catalog_district VALUES ('00000000-0000-0000-0000-000000000001', 'Chilonzor');
          CREATE TABLE businesses_businessrequest (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(), created_at timestamptz NOT NULL DEFAULT now(),
            business_name text, activity text, district_id uuid, contact_name text, phone text, status text);
          INSERT INTO businesses_businessrequest
            (business_name, activity, district_id, contact_name, phone, status, created_at) VALUES
            ('Baraka sartaroshxonasi', 'soch turmagi', '00000000-0000-0000-0000-000000000001',
             'Aziz', '+998901234567', 'new', now() - interval '2 hours'),
            ('Eski so''rov', '', NULL, 'Olim', '+998907654321', 'converted', now() - interval '1 hour'),
            ('Tikuvchi Malika', '', NULL, 'Malika', '+998935556677', 'new', now() - interval '30 minutes');
          SQL

          # Birinchi marta: ko'rib chiqilmagan barcha so'rovlar, ism va telefonsiz
          out=$(sudo backup/new-requests.sh)
          echo "$out"
          grep -q "yangi biznes so'rovi (2)" <<<"$out"
          grep -q "Baraka sartaroshxonasi — soch turmagi (Chilonzor)" <<<"$out"
          grep -q "Tikuvchi Malika" <<<"$out"
          grep -q "Koʻrish: http://localhost/admin/sorovlar" <<<"$out"
          if grep -qE "Eski|Aziz|Olim|\+998" <<<"$out"; then echo "Ortiqcha yoki shaxsiy maʼlumot"; exit 1; fi

          # Qayta — hech narsa; yangi so'rov — faqat o'zi
          test -z "$(sudo backup/new-requests.sh)"
          docker compose exec -T db psql -U postgres -d yaqin -c \
            "INSERT INTO businesses_businessrequest (business_name, activity, status) VALUES ('Usta Bobur', 'santexnik', 'new');"
          out=$(sudo backup/new-requests.sh)
          echo "$out"
          grep -q "yangi biznes so'rovi (1)" <<<"$out"
          grep -q "Usta Bobur — santexnik" <<<"$out"
          if grep -q "Baraka" <<<"$out"; then echo "Eski so'rov qayta eʼlon qilindi"; exit 1; fi

      - name: Loglar
        if: failure()
        run: |
          docker compose logs --no-color --tail 100 db || true
          docker logs s3 --tail 50 || true
