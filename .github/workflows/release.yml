name: Release

# Production image'lari: production qiymatlari bilan yig'iladi, docker.yml dagidek butun to'plamda
# smoke test bilan tekshiriladi va GitHub Container Registry'ga joylanadi. Qo'lda ishga tushiriladi:
# GitHub → Actions → Release → Run workflow. Serverga joylash — natija sahifasidagi buyruq
# (./deploy.sh <commit>, docs/deployment.md).
#
# NEXT_PUBLIC_* qiymatlari brauzer kodiga yoziladi, maxfiy emas — repo Variables'dan
# (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL          https://yaqinapp.uz (bo'lmasa shu)
#   TELEGRAM_BOT      bot username, @ siz (bo'lmasa — Telegram orqali kirish o'chiq)
#   GOOGLE_CLIENT_ID  OAuth client ID (bo'lmasa — Google orqali kirish o'chiq)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: deploy

env:
  COMPOSE_FILE: compose.yaml:compose.ci.yaml
  SOURCE: https://github.com/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Image nomlari (commit bo'yicha)
        run: |
          owner=$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")
          tag=$(git rev-parse --short=12 HEAD)
          {
            echo "TAG=$tag"
            echo "BACKEND_IMAGE=ghcr.io/$owner/yaqin-backend:$tag"
            echo "FRONTEND_IMAGE=ghcr.io/$owner/yaqin-frontend:$tag"
          } >>"$GITHUB_ENV"

      - name: CI muhiti (har safar yangi tasodifiy qiymatlar — boshqa hech qayerda ishlatilmaydi)
        run: |
          cat > .env <<EOF
          SITE_DOMAIN=localhost
          SITE_URL=http://localhost
          SITE_ADDRESS=http://localhost
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          DATABASE_PASSWORD=$(openssl rand -hex 24)
          DJANGO_SECRET_KEY=$(openssl rand -hex 32)
          TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')
          REVALIDATE_SECRET=$(openssl rand -hex 24)
          EOF

      - name: Backend image
        run: docker build --label "org.opencontainers.image.source=$SOURCE" -t "$BACKEND_IMAGE" ../backend

      - name: Baza, migratsiyalar, backend
        run: |
          docker compose up -d --wait db redis
          docker compose run --rm backend python manage.py migrate --noinput
          docker compose up -d --wait backend

      - name: Frontend image (production qiymatlari bilan)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://yaqinapp.uz' }}
          TELEGRAM_BOT: ${{ vars.TELEGRAM_BOT }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: >-
          docker build --network host
          --label "org.opencontainers.image.source=$SOURCE"
          --build-arg API_URL=http://127.0.0.1:8000/api/v1
          --build-arg "NEXT_PUBLIC_SITE_URL=$SITE_URL"
          --build-arg "NEXT_PUBLIC_TELEGRAM_BOT=$TELEGRAM_BOT"
          --build-arg "NEXT_PUBLIC_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
          -t "$FRONTEND_IMAGE" ../frontend

      - name: To'liq to'plam
        run: docker compose up -d --wait

      - name: Smoke test
        run: BASE=http://localhost ./smoke.sh

      - name: Registry'ga joylash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"

      - name: Natija
        run: |
          {
            echo "### Release \`$TAG\`"
            echo
            echo "- \`$BACKEND_IMAGE\`"
            echo "- \`$FRONTEND_IMAGE\`"
            echo
            echo "Serverda: \`ssh yaqin\` → \`cd yaqin/deploy && ./deploy.sh $TAG\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Loglar
        if: failure()
        run: docker compose logs --no-color --tail 200
