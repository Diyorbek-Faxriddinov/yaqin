name: Frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "docs/api/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "docs/api/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: API tiplari OpenAPI kontraktiga mosligini tekshirish
        run: npm run api:types && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Playwright brauzerini o'rnatish
        run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
