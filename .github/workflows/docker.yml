name: Docker

# Production image'lari va to'plami (deploy/compose.yaml): backend va frontend image'lari yig'iladi,
# butun to'plam (PostGIS, Redis, Django, Next.js, Caddy) productiondagidek ishga tushadi va
# deploy/smoke.sh bilan tekshiriladi. Serverga joylash — keyingi qadam (5.4).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: deploy

env:
  COMPOSE_FILE: compose.yaml:compose.ci.yaml

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: CI muhiti (har safar yangi tasodifiy qiymatlar — boshqa hech qayerda ishlatilmaydi)
        run: |
          cat > .env <<EOF
          SITE_DOMAIN=localhost
          SITE_URL=http://localhost
          SITE_ADDRESS=http://localhost
          ACME_EMAIL=ci@example.com
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          DATABASE_PASSWORD=$(openssl rand -hex 24)
          DJANGO_SECRET_KEY=$(openssl rand -hex 32)
          TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')
          REVALIDATE_SECRET=$(openssl rand -hex 24)
          EOF

      - name: Backend image
        run: docker compose build backend

      - name: Baza, migratsiyalar, backend
        run: |
          docker compose up -d --wait db redis
          docker compose run --rm backend python manage.py migrate --noinput
          docker compose up -d --wait backend

      - name: Frontend image (build vaqtida sahifalar backenddan tayyorlanadi)
        working-directory: frontend
        run: >-
          docker build --network host
          --build-arg API_URL=http://127.0.0.1:8000/api/v1
          --build-arg NEXT_PUBLIC_SITE_URL=http://localhost
          -t yaqin-frontend:local .

      - name: To'liq to'plam
        run: docker compose up -d --wait

      - name: Smoke test
        run: BASE=http://localhost ./smoke.sh

      - name: Image o'lchamlari
        if: always()
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep yaqin || true

      - name: Loglar
        if: failure()
        run: docker compose logs --no-color --tail 200
