# API shartnomasi loyihasi — mahsulot teglari va yumshoq qidiruv (ADR-0016).
# Backend bilan birga asosiy docs/api/openapi.yaml ga ko'chiriladi va bu fayl o'chiriladi.
# Alohida turishining sababi: backend testlari kontraktdagi har bir operatsiya sinalganini va javoblar
# sxemaga mosligini tekshiradi — amalga oshirilmagan maydon va endpoint CI'ni yiqitardi.

paths:
  /admin/businesses/{businessId}/tag-suggestions:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      tags: [admin]
      operationId: adminGetTagSuggestions
      summary: Mahsulot teglari uchun takliflar — ruxsat business.view
      security: [{ adminSessionCookie: [] }]
      responses:
        "200":
          description: Takliflar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagSuggestions" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /cabinet/businesses/{businessId}/tag-suggestions:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      tags: [cabinet]
      operationId: getOwnedTagSuggestions
      summary: Mahsulot teglari uchun takliflar (faqat biznes egasi)
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Takliflar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagSuggestions" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    TagSuggestions:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 40
          description: |
            Avval shu biznes teglari, keyin shu kategoriyada e'lon qilingan bizneslarda eng ko'p
            ishlatilgan 20 ta teg. Takrorlar olib tashlangan.
          items: { type: string, maxLength: 40 }

    # --- Mavjud sxemalarga qo'shiladigan maydonlar ---

    # ItemInput.properties ga (required ga kirmaydi):
    ItemInputAddition:
      type: object
      properties:
        tags:
          type: array
          maxItems: 15
          description: |
            Qidiruv teglari — saytda ko'rinmaydi. Yuborilmasa: yangi mahsulotda bo'sh, mavjudida
            o'zgarmaydi. Har biri 2–40 belgi; bir xil teg bir marta saqlanadi.
          items: { type: string, minLength: 2, maxLength: 40 }

    # AdminItem ga (required) — ommaviy Item ga QO'SHILMAYDI:
    AdminItemAddition:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items: { type: string }

    # BusinessPage ga (required):
    BusinessPageAddition:
      type: object
      required: [relaxed]
      properties:
        relaxed:
          type: boolean
          description: |
            Qattiq qidiruv bo'sh qaytgani uchun yumshoq qidiruv natijasi: so'zlarning kamida yarmi
            mos keladi. Sahifa buni foydalanuvchiga aytishi kerak.

    # ChangeField.field ga yangi qiymat: `item.tags` (qiymat — satrlar ro'yxati).
