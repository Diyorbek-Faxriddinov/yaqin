        isBlocked: { type: boolean }
        blockedReason: { type: [string, "null"] }
        reviewsCount: { type: integer }
        complaintsCount: { type: integer }

    AdminUserPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

