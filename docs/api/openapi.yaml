              type: object
              required: [name, categoryName, districtName, isPublished]
              properties:
                name: { type: string }
                categoryName: { type: string }
                districtName: { type: string }
                isPublished: { type: boolean }
            generatedAt: { type: string, format: date-time }

    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, error]
        database:
          type: string
          enum: [ok, error]
