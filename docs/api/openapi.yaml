      description: "`pending` — eng eskisi birinchi (navbat), qolganlari — eng yangisi birinchi."
      security: [{ adminSessionCookie: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ReviewStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Sharhlar sahifasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReviewPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/reviews/{reviewId}:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      operationId: adminModerateReview
      summary: Sharhni chop etish yoki rad etish — ruxsat review.moderate
      description: |
        Rad etishda sabab majburiy — muallif uni "Mening sharhlarim"da ko'radi. Chop etilgan
        sharhni keyin rad etish ham mumkin (masalan, spam aniqlansa). Biznes reytingi qayta hisoblanadi.
      security: [{ adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [published, rejected]
                rejectionReason:
                  { type: [string, "null"], minLength: 3, maxLength: 200 }
      responses:
        "200":
          description: Saqlandi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReview" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

