      tags: [admin]
      operationId: adminCreateCategory
      summary: Kategoriya qo'shish — ruxsat category.manage
      description: |
        Ikki daraja: `parentId: null` — yuqori daraja (`iconKey` majburiy), aks holda ichki kategoriya
