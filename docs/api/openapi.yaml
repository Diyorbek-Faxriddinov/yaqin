        roleIds:
          type: array
          items: { type: string, format: uuid }
        extraPermissions:
          type: array
          items: { $ref: "#/components/schemas/AdminPermission" }
        isActive: { type: boolean }

    AdminRole:
      type: object
      required: [id, name, description, permissions, isBuiltIn, adminCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/AdminPermission" }
        isBuiltIn:
          type: boolean
          description: Tizim roli — o'chirib bo'lmaydi (ruxsatlarini o'zgartirish mumkin)
        adminCount: { type: integer }

    AdminRoleInput:
      type: object
      required: [name, description, permissions]
      properties:
        name: { type: string, minLength: 2, maxLength: 40 }
        description: { type: [string, "null"], maxLength: 200 }
        permissions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AdminPermission" }

    AuditTargetType:
      type: string
      enum:
        - auth
        - business
        - item
        - photo
        - review
        - complaint
        - category
        - request
        - user
        - admin
        - role
        - settings
        - report

    AuditEntry:
      type: object
      required: [id, at, admin, action, targetType, targetId, summary]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        admin:
          oneOf:
            - type: object
              required: [id, displayName]
              properties:
                id: { type: string, format: uuid }
                displayName: { type: string }
            - type: "null"
        action:
          type: string
          description: "Masalan: business.update, review.reject, auth.login"
        targetType: { $ref: "#/components/schemas/AuditTargetType" }
        targetId: { type: string }
        summary: { type: string }

    AuditPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    PlatformContacts:
      type: object
      required: [telegram, email, phone]
      properties:
        telegram: { type: [string, "null"], pattern: "^[A-Za-z0-9_]{5,32}$" }
        email: { type: [string, "null"], format: email, maxLength: 120 }
        phone: { type: [string, "null"], pattern: "^\\+998\\d{9}$" }

    PlatformSettings:
      type: object
      required: [reviewsPremoderation, businessRequestsOpen, contacts]
      properties:
        reviewsPremoderation:
          type: boolean
          description: true — sharhlar moderatsiyadan keyin chiqadi; false — darhol (keyin rad etish mumkin)
        businessRequestsOpen:
          type: boolean
          description: '"Biznesingizni qo''shing" formasi so''rov qabul qiladimi'
        contacts: { $ref: "#/components/schemas/PlatformContacts" }

    PublicSettings:
      type: object
      required: [businessRequestsOpen, contacts]
      properties:
        businessRequestsOpen: { type: boolean }
        contacts: { $ref: "#/components/schemas/PlatformContacts" }

    StatsTotals:
      type: object
      required: [profileViews, calls, telegramClicks, directionClicks]
      properties:
        profileViews: { type: integer }
        calls: { type: integer }
        telegramClicks: { type: integer }
        directionClicks: { type: integer }

    StatsDay:
      allOf:
        - $ref: "#/components/schemas/StatsTotals"
        - type: object
          required: [date]
          properties:
            date:
              type: string
              format: date
              description: Toshkent vaqti bo'yicha kun (YYYY-MM-DD)

    StatsSeries:
      type: object
      required: [from, to, days, totals, daily]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer }
        totals: { $ref: "#/components/schemas/StatsTotals" }
        daily:
          type: array
          items: { $ref: "#/components/schemas/StatsDay" }

    PlatformStats:
      allOf:
        - $ref: "#/components/schemas/StatsSeries"
        - type: object
          required: [topBusinesses, content]
          properties:
            topBusinesses:
              type: array
              maxItems: 10
              items:
                type: object
                required: [business, profileViews, contactClicks]
                properties:
                  business: { $ref: "#/components/schemas/AdminBusinessRef" }
                  profileViews: { type: integer }
                  contactClicks:
                    type: integer
                    description: Qo'ng'iroq + Telegram + yo'nalish bosishlari
            content:
              type: object
              required:
                [
                  publishedBusinesses,
                  newBusinesses,
                  newReviews,
                  newComplaints,
                  newRequests,
                ]
              properties:
                publishedBusinesses: { type: integer }
                newBusinesses: { type: integer }
                newReviews: { type: integer }
                newComplaints: { type: integer }
                newRequests: { type: integer }

    ReportLinkStatus:
