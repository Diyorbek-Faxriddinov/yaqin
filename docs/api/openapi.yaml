      type: string
      description: new — yangi, contacted — bog'lanildi, converted — biznes yaratildi, rejected — rad etildi
      enum: [new, contacted, converted, rejected]

    AdminBusinessRequest:
      type: object
      required:
        - id
        - businessName
        - activity
        - district
        - address
        - contactName
        - phone
        - note
        - status
        - adminNote
        - businessId
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        businessName: { type: string }
        activity: { type: [string, "null"] }
        district:
          oneOf:
            - $ref: "#/components/schemas/DistrictRef"
            - type: "null"
        address: { type: [string, "null"] }
        contactName: { type: string }
        phone: { type: string }
        note: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/BusinessRequestStatus" }
        adminNote: { type: [string, "null"] }
        businessId:
          type: [string, "null"]
          format: uuid
          description: converted bo'lsa — yaratilgan biznes
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminBusinessRequestPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminBusinessRequest" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    AdminUser:
      type: object
      required:
