openapi: 3.1.0
info:
  title: Yaqin API
  version: 0.1.0
  description: |
    Yaqin platformasining API kontrakti — frontend va backend uchun yagona manba.

    - Frontend tiplari shu fayldan generatsiya qilinadi: `cd frontend && npm run api:types`.
    - Ishlab chiqishda frontend shu kontraktga mos mock handler'lar bilan ishlaydi (ADR-0011).
    - Pul summalari — butun son, tiyinda (ADR-0010). Vaqt — ISO 8601.
    - Lokalizatsiya qilinadigan maydonlar (kategoriya, tuman nomlari) `lang` parametri bo'yicha qaytadi.

    Bu versiya — ommaviy (o'qish) qismi. Autentifikatsiya, mijoz va admin endpointlari
    keyingi qadamlarda qo'shiladi.
servers:
  - url: /api/v1

tags:
  - name: catalog
    description: Kategoriyalar va tumanlar
  - name: businesses
    description: Bizneslar, qidiruv
  - name: stats
    description: Statistika hodisalari
  - name: auth
    description: Kirish va chiqish (ADR-0006, ADR-0012)
  - name: me
    description: Joriy foydalanuvchi — profil, sevimlilar, sharhlar, shikoyatlar
  - name: admin
    description: Admin panel — har bir endpoint ruxsatni backendda tekshiradi (ADR-0009)

paths:
  /categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: Kategoriyalar daraxti (yuqori daraja + ichki kategoriyalar)
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Kategoriyalar daraxti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryNode"

  /categories/{slug}:
    get:
      tags: [catalog]
      operationId: getCategory
      summary: Bitta kategoriya — ota-kategoriya, ichki kategoriyalar va atributlar bilan
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Kategoriya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /districts:
    get:
      tags: [catalog]
      operationId: listDistricts
      summary: Toshkent tumanlari
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Tumanlar ro'yxati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/District"

  /businesses:
    get:
      tags: [businesses]
      operationId: listBusinesses
      summary: Bizneslarni qidirish va filtrlash
      description: |
        `q` — lotin yoki kirill yozuvida; apostrof turlari (ʻ ‘ ' `) farqlanmaydi.
        `lat`/`lng` berilsa, har bir natijada `distanceMeters` qaytadi va `sort=distance` ishlaydi.
        Server joylashuvni saqlamaydi va loglarga yozmaydi.
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          description: Kategoriya slug'i; ichki kategoriyalar ham kiradi
          schema: { type: string }
        - name: district
          in: query
          description: Tuman slug'i
          schema: { type: string }
        - name: openNow
          in: query
          schema: { type: boolean }
        - name: lat
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [recommended, rating, distance, newest]
            default: recommended
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Bizneslar sahifasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessPage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /businesses/{slug}:
    get:
      tags: [businesses]
      operationId: getBusiness
      summary: Biznes profili
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Biznes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /businesses/{slug}/items:
    get:
      tags: [businesses]
      operationId: listBusinessItems
      summary: Biznesning mahsulot va xizmatlari (narxlar)
      description: Tartib — biznes belgilagan guruh va tartib bo'yicha. Sahifalanmaydi (maksimum 300).
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Mahsulot va xizmatlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"

  /businesses/{slug}/items/{itemSlug}:
    get:
      tags: [businesses]
      operationId: getBusinessItem
      summary: Bitta mahsulot yoki xizmat
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: itemSlug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$", maxLength: 120 }
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Mahsulot yoki xizmat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"

  /businesses/{slug}/reviews:
    get:
      tags: [businesses]
      operationId: listBusinessReviews
      summary: Biznes sharhlari (yangilari birinchi)
      description: Faqat moderatsiyadan o'tgan sharhlar.
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Sharhlar sahifasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [me]
      operationId: createReview
      summary: Sharh qoldirish
      description: |
        Bitta foydalanuvchi bitta biznesga bitta sharh (aks holda 409). Sharh moderatsiyadan
        so'ng chiqadi (`status: pending`). Rate limiting backendda.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyReview" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /map/markers:
    get:
      tags: [businesses]
      operationId: listMapMarkers
      summary: Xarita uchun yengil biznes nuqtalari
      description: Sahifalanmaydi; maksimum 1000 ta. Filtrlar /businesses bilan bir xil.
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: category
          in: query
          schema: { type: string }
        - name: district
          in: query
          schema: { type: string }
        - name: openNow
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Nuqtalar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapMarker"

  /auth/telegram:
    post:
      tags: [auth]
      operationId: loginTelegram
      summary: Telegram Login Widget orqali kirish
      description: |
        Backend Telegram maʼlumotlarini bot tokeni bilan imzo (hash) bo'yicha tekshiradi va
        `auth_date` eskirmaganini nazorat qiladi. Muvaffaqiyatli bo'lsa sessiya cookie'si o'rnatiladi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramAuth"
      responses:
        "200":
          $ref: "#/components/responses/LoggedIn"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/google:
    post:
      tags: [auth]
      operationId: loginGoogle
      summary: Google Identity Services orqali kirish (ID token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, description: Google ID token (JWT) }
      responses:
        "200":
          $ref: "#/components/responses/LoggedIn"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/demo:
    post:
      tags: [auth]
      operationId: loginDemo
      summary: Demo foydalanuvchi sifatida kirish
      description: Faqat demo/ishlab chiqish muhitida. Productionda bu endpoint mavjud emas (404).
      responses:
        "200":
          $ref: "#/components/responses/LoggedIn"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Chiqish (sessiya bekor qilinadi)
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: Chiqildi

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Joriy foydalanuvchi
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Foydalanuvchi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [me]
      operationId: updateMe
      summary: Profilni tahrirlash
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 2, maxLength: 40 }
      responses:
        "200":
          description: Yangilangan foydalanuvchi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Akkauntni o'chirish
      description: Shaxsiy maʼlumotlar o'chiriladi; sharhlar "O'chirilgan foydalanuvchi" nomi bilan qoladi.
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: O'chirildi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /me/favorites:
    get:
      tags: [me]
      operationId: listFavorites
      summary: Sevimli bizneslar (oxirgi qo'shilgani birinchi)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Bizneslar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/favorites/ids:
    get:
      tags: [me]
      operationId: listFavoriteIds
      summary: Sevimli bizneslar ID'lari (yurakcha holati uchun)
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: ID'lar
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/favorites/{businessId}:
    parameters:
      - name: businessId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [me]
      operationId: addFavorite
      summary: Sevimlilarga qo'shish (idempotent)
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: Qo'shildi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [me]
      operationId: removeFavorite
      summary: Sevimlilardan olib tashlash (idempotent)
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: Olib tashlandi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /me/reviews:
    get:
      tags: [me]
      operationId: listMyReviews
      summary: Mening sharhlarim (holati bilan)
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Sharhlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MyReview" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/reviews/{reviewId}:
    delete:
      tags: [me]
      operationId: deleteMyReview
      summary: O'z sharhini o'chirish
      security: [{ sessionCookie: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: O'chirildi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /complaints:
    post:
      tags: [me]
      operationId: createComplaint
      summary: Biznes haqida shikoyat yoki noto'g'ri maʼlumot xabari
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintInput" }
      responses:
        "201":
          description: Qabul qilindi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /me/complaints:
    get:
      tags: [me]
      operationId: listMyComplaints
      summary: Mening shikoyatlarim (holati bilan)
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Shikoyatlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Complaint" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Admin kirishi — 1-qadam (login va parol)
      description: |
        Muvaffaqiyatli bo'lsa sessiya hali yaratilmaydi — 2FA uchun qisqa muddatli `challengeToken`
        qaytadi. Ketma-ket muvaffaqiyatsiz urinishlar cheklanadi (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 256 }
      responses:
        "200":
          description: 2FA kodi kerak
          content:
            application/json:
              schema:
                type: object
                required: [challengeToken]
                properties:
                  challengeToken: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin/auth/2fa:
    post:
      tags: [admin]
      operationId: adminVerify2fa
      summary: Admin kirishi — 2-qadam (TOTP kodi)
      description: |
        Muvaffaqiyatli bo'lsa `adminsessionid` (HttpOnly, Secure, SameSite=Strict, 8 soat) va
        `csrftoken` cookie'lari o'rnatiladi. Admin sessiyasi mijoz sessiyasidan alohida.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200":
          description: Kirildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMe" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin/auth/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      summary: Admin sessiyasini tugatish
      security: [{ adminSessionCookie: [] }]
      responses:
        "204":
          description: Chiqildi

  /admin/me:
    get:
      tags: [admin]
      operationId: getAdminMe
      summary: Joriy administrator va amaldagi ruxsatlari
      security: [{ adminSessionCookie: [] }]
      responses:
        "200":
          description: Administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMe" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/businesses:
    get:
      tags: [admin]
      operationId: adminListBusinesses
      summary: Bizneslar (barcha holatlar) — ruxsat business.view
      security: [{ adminSessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/BusinessStatus" }
        - name: missingConsent
          in: query
          description: Faqat rozilik qayd etilmaganlar
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Bizneslar sahifasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBusinessPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: adminCreateBusiness
      summary: Yangi biznes (qoralama) — ruxsat business.edit
      description: Platforma boshqaruvidagi qoralama sifatida yaratiladi (ADR-0007).
      security: [{ adminSessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Lang"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBusinessCreate" }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBusiness" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/businesses/{businessId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      tags: [admin]
      operationId: adminGetBusiness
      summary: Biznesni tahrirlash uchun to'liq maʼlumot
      security: [{ adminSessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Biznes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBusiness" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [admin]
      operationId: adminUpdateBusiness
      summary: Biznesni qisman yangilash — ruxsat business.edit (holat — business.publish)
      description: |
        `status: published` faqat nomi, kategoriyasi, joylashuvi, manzili va rozilik qayd
        etilgan bo'lsa (aks holda 400, `fields` da yetishmaganlar). Har bir o'zgarish audit
        jurnaliga yoziladi.
      security: [{ adminSessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Lang"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBusinessUpdate" }
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBusiness" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/businesses/{businessId}/photos:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    post:
      tags: [admin]
      operationId: adminUploadPhoto
      summary: Rasm yuklash — ruxsat business.edit
      description: |
        JPEG, PNG yoki WebP, ko'pi bilan 5 MB. Backend rasmni qayta kodlaydi (EXIF, jumladan
        GPS, olib tashlanadi) va o'lchamlarini tekshiradi.
      security: [{ adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                alt: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Yuklandi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPhoto" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Fayl juda katta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/businesses/{businessId}/photos/order:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    put:
      tags: [admin]
      operationId: adminReorderPhotos
      summary: Rasmlar tartibi (birinchisi — muqova)
      security: [{ adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoIds]
              properties:
                photoIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204":
          description: Saqlandi
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/businesses/{businessId}/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - name: photoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      operationId: adminDeletePhoto
      summary: Rasmni o'chirish
      security: [{ adminSessionCookie: [] }]
      responses:
        "204":
          description: O'chirildi
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/businesses/{businessId}/items:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      tags: [admin]
      operationId: adminListItems
      summary: Biznes katalogi (mavjud bo'lmaganlari bilan)
      security: [{ adminSessionCookie: [] }]
      responses:
        "200":
          description: Mahsulot va xizmatlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [admin]
      operationId: adminCreateItem
      summary: Mahsulot yoki xizmat qo'shish
      security: [{ adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }
      responses:
        "201":
          description: Qo'shildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/businesses/{businessId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      operationId: adminUpdateItem
      summary: Mahsulot yoki xizmatni yangilash
      security: [{ adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      operationId: adminDeleteItem
      summary: Mahsulot yoki xizmatni o'chirish
      security: [{ adminSessionCookie: [] }]
      responses:
        "204":
          description: O'chirildi
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /search/suggest:
    get:
      tags: [businesses]
      operationId: searchSuggest
      summary: Qidiruv takliflari (autocomplete)
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "200":
          description: Takliflar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchSuggestions"

  /events:
    post:
      tags: [stats]
      operationId: trackEvent
      summary: Statistika hodisasi (ko'rish, qo'ng'iroq, yo'nalish bosish)
      description: Shaxsiy maʼlumot va joylashuv saqlanmaydi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsEvent"
      responses:
        "202":
          description: Qabul qilindi
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: |
        httpOnly, Secure, SameSite=Lax sessiya cookie'si. O'zgartiruvchi so'rovlar (POST/PUT/PATCH/DELETE)
        qo'shimcha ravishda `X-CSRFToken` sarlavhasini talab qiladi — qiymati `csrftoken` cookie'sidan
        (double-submit, Django CSRF bilan mos). Qarang: ADR-0012.

    adminSessionCookie:
      type: apiKey
      in: cookie
      name: adminsessionid
      description: |
        Admin sessiyasi — mijoz sessiyasidan alohida: HttpOnly, Secure, SameSite=Strict, 8 soat.
        Kirish ikki bosqichli (parol + TOTP). CSRF qoidalari sessionCookie bilan bir xil.

  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Lang:
      name: lang
      in: query
      schema:
        $ref: "#/components/schemas/Locale"
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]+$", maxLength: 120 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    NotFound:
      description: Topilmadi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Notoʻgʻri soʻrov
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Kirilmagan yoki sessiya eskirgan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Ruxsat yoʻq yoki CSRF token notoʻgʻri
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Juda ko'p urinish — keyinroq qayta urinib ko'ring
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Holat ziddiyati (masalan, sharh allaqachon mavjud)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LoggedIn:
      description: Kirildi; `sessionid` (httpOnly) va `csrftoken` cookie'lari o'rnatiladi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Me"

  schemas:
    Locale:
      type: string
      enum: [uz, ru]
      default: uz

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [not_found, validation_error]
        message:
          type: string
          description: Foydalanuvchiga koʻrsatsa boʻladigan, soʻralgan tildagi xabar
        fields:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Tiyinda (1 soʻm = 100 tiyin)
        currency:
          type: string
          enum: [UZS]

    PriceRange:
      type: object
      required: [min, max]
      properties:
        min: { $ref: "#/components/schemas/Money" }
        max: { $ref: "#/components/schemas/Money" }

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }

    Image:
      type: object
      required: [url, width, height]
      properties:
        url: { type: string, format: uri }
        width: { type: integer }
        height: { type: integer }
        alt: { type: [string, "null"] }

    CategoryRef:
      type: object
      required: [id, slug, name, iconKey]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        iconKey:
          type: [string, "null"]
          description: Frontend ikonka kaliti (shopping, food, beauty, ...)

    CategoryNode:
      allOf:
        - $ref: "#/components/schemas/CategoryRef"
        - type: object
          required: [businessCount, children]
          properties:
            businessCount:
              type: integer
              description: Ushbu kategoriya va uning ichki kategoriyalaridagi eʼlon qilingan bizneslar
            children:
              type: array
              items:
                $ref: "#/components/schemas/CategoryNode"

    AttributeDefinition:
      type: object
      required: [key, name, type, filterable]
      properties:
        key: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [text, number, boolean, select, multiselect]
        unit: { type: [string, "null"] }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
        filterable: { type: boolean }

    CategoryDetail:
      allOf:
        - $ref: "#/components/schemas/CategoryNode"
        - type: object
          required: [parent, attributes]
          properties:
            parent:
              oneOf:
                - $ref: "#/components/schemas/CategoryRef"
                - type: "null"
            attributes:
              type: array
              items:
                $ref: "#/components/schemas/AttributeDefinition"

    District:
      type: object
      required: [id, slug, name, center]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        center: { $ref: "#/components/schemas/GeoPoint" }

    DistrictRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    TimeInterval:
      type: object
      required: [open, close]
      description: |
        Mahalliy vaqt (Asia/Tashkent), "HH:MM". `close` ≤ `open` bo'lsa, interval keyingi kunga
        o'tadi (masalan 18:00–02:00). "24:00" — kun oxiri.
      properties:
        open: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        close: { type: string, pattern: "^(([01]\\d|2[0-3]):[0-5]\\d|24:00)$" }

    WeeklySchedule:
      type: object
      required: [is24x7, days]
      properties:
        is24x7: { type: boolean }
        days:
          type: array
          description: Roʻyxatda yoʻq kun — dam olish kuni
          items:
            type: object
            required: [weekday, intervals]
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
                description: ISO 8601 — 1 dushanba, 7 yakshanba
              intervals:
                type: array
                items:
                  $ref: "#/components/schemas/TimeInterval"

    RatingSummary:
      type: object
      required: [average, count]
      properties:
        average:
          type: [number, "null"]
          description: 1–5; sharh boʻlmasa null
        count: { type: integer }

    BusinessSummary:
      type: object
      required:
        - id
        - slug
        - name
        - category
        - district
        - location
        - coverImage
        - rating
        - priceRange
        - schedule
        - distanceMeters
        - isVerified
        - createdAt
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/CategoryRef" }
        district: { $ref: "#/components/schemas/DistrictRef" }
        location: { $ref: "#/components/schemas/GeoPoint" }
        coverImage:
          oneOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"
        rating: { $ref: "#/components/schemas/RatingSummary" }
        priceRange:
          oneOf:
            - $ref: "#/components/schemas/PriceRange"
            - type: "null"
        schedule:
          oneOf:
            - $ref: "#/components/schemas/WeeklySchedule"
            - type: "null"
          description: null — ish vaqti nomaʼlum
        distanceMeters:
          type: [number, "null"]
          description: Faqat lat/lng berilganda
        isVerified:
          type: boolean
          description: Platforma tomonidan joyida tekshirilgan
        createdAt: { type: string, format: date-time }

    BusinessPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BusinessSummary"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Phone:
      type: object
      required: [number]
      properties:
        number:
          type: string
          description: E.164, masalan +998901234567
        label: { type: [string, "null"] }

    BusinessDetail:
      allOf:
        - $ref: "#/components/schemas/BusinessSummary"
        - type: object
          required: [description, address, phones, telegram, instagram, website, gallery]
          properties:
            description: { type: [string, "null"] }
            address:
              type: object
              required: [text, landmark]
              properties:
                text: { type: string }
                landmark:
                  type: [string, "null"]
                  description: Moʻljal — "Chorsu bozori yonida"
            phones:
              type: array
              items: { $ref: "#/components/schemas/Phone" }
            telegram:
              type: [string, "null"]
              description: Foydalanuvchi nomi, @ siz
            instagram: { type: [string, "null"] }
            website: { type: [string, "null"], format: uri }
            gallery:
              type: array
              items: { $ref: "#/components/schemas/Image" }

    ItemPrice:
      type: object
      required: [type, min, max]
      description: |
        - fixed — aniq narx (`min`);
        - from — "... dan" (`min`);
        - range — oraliq (`min`–`max`);
        - on_request — narx so'rov bo'yicha (`min`, `max` — null).
      properties:
        type:
          type: string
          enum: [fixed, from, range, on_request]
        min:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        max:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"

    ItemAttribute:
      type: object
      required: [key, name, value]
      properties:
        key: { type: string }
        name: { type: string }
        value:
          type: string
          description: Koʻrsatish uchun tayyor qiymat ("42", "Qora, oq", "Ha")

    Item:
      type: object
      required:
        - id
        - slug
        - kind
        - name
        - group
        - description
        - price
        - durationMinutes
        - attributes
        - images
        - isAvailable
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        kind:
          type: string
          enum: [product, service]
        name: { type: string }
        group:
          type: [string, "null"]
          description: Biznes ichidagi boʻlim ("Soch turmagi", "Ichimliklar")
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/ItemPrice" }
        durationMinutes:
          type: [integer, "null"]
          description: Faqat xizmatlar uchun
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ItemAttribute" }
        images:
          type: array
          items: { $ref: "#/components/schemas/Image" }
        isAvailable:
          type: boolean
          description: Hozir mavjud / koʻrsatiladi

    Review:
      type: object
      required: [id, authorName, rating, text, createdAt, reply]
      properties:
        id: { type: string, format: uuid }
        authorName:
          type: string
          description: Koʻrsatiladigan ism (masalan "Aziz T."); toʻliq ism va kontaktlar qaytarilmaydi
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        reply:
          description: Biznes javobi
          oneOf:
            - type: object
              required: [text, createdAt]
              properties:
                text: { type: string }
                createdAt: { type: string, format: date-time }
            - type: "null"

    ReviewPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    MapMarker:
      type: object
      required: [id, slug, name, location, category, rating, schedule]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        location: { $ref: "#/components/schemas/GeoPoint" }
        category: { $ref: "#/components/schemas/CategoryRef" }
        rating: { $ref: "#/components/schemas/RatingSummary" }
        schedule:
          oneOf:
            - $ref: "#/components/schemas/WeeklySchedule"
            - type: "null"

    TelegramAuth:
      type: object
      description: Telegram Login Widget qaytaradigan maydonlar (o'zgartirilmasdan)
      required: [id, first_name, auth_date, hash]
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        username: { type: string }
        photo_url: { type: string, format: uri }
        auth_date: { type: integer }
        hash: { type: string }

    Me:
      type: object
      required: [id, displayName, avatarUrl, provider, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: [string, "null"], format: uri }
        provider:
          type: string
          enum: [telegram, google, demo]
        createdAt: { type: string, format: date-time }

    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: [string, "null"], maxLength: 1000 }

    MyReview:
      type: object
      required: [id, business, rating, text, status, rejectionReason, createdAt]
      properties:
        id: { type: string, format: uuid }
        business:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: [string, "null"] }
        status:
          type: string
          enum: [pending, published, rejected]
        rejectionReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    ComplaintReason:
      type: string
      enum: [wrong_info, closed_permanently, wrong_location, fake_reviews, fraud, other]

    ComplaintInput:
      type: object
      required: [businessId, reason]
      properties:
        businessId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ComplaintReason" }
        text:
          type: [string, "null"]
          maxLength: 1000
          description: "`other` uchun majburiy (kamida 10 belgi)"

    Complaint:
      type: object
      required: [id, business, reason, text, status, resolutionNote, createdAt]
      properties:
        id: { type: string, format: uuid }
        business:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        reason: { $ref: "#/components/schemas/ComplaintReason" }
        text: { type: [string, "null"] }
        status:
          type: string
          enum: [open, in_review, resolved, rejected]
        resolutionNote: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    AdminPermission:
      type: string
      description: Atomar ruxsat (ADR-0009). Root barcha ruxsatlarga ega.
      enum:
        - business.view
        - business.edit
        - business.publish
        - category.manage
        - review.moderate
        - complaint.manage
        - user.view
        - staff.manage
        - audit.view
        - settings.manage

    AdminMe:
      type: object
      required: [id, username, displayName, isRoot, permissions]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        isRoot: { type: boolean }
        permissions:
          type: array
          description: Amaldagi (rollar va alohida ruxsatlardan hisoblangan) ruxsatlar
          items: { $ref: "#/components/schemas/AdminPermission" }

    BusinessStatus:
      type: string
      description: draft — qoralama (saytda yo'q), published — e'lon qilingan, hidden — vaqtincha yashirilgan
      enum: [draft, published, hidden]

    Consent:
      type: object
      required: [givenBy, givenAt, note]
      description: Biznes egasining maʼlumotlarni e'lon qilishga roziligi (ADR-0007)
      properties:
        givenBy: { type: string, maxLength: 100, description: Kim rozilik berdi (ism, lavozim) }
        givenAt: { type: string, format: date-time }
        note: { type: [string, "null"], maxLength: 500 }

    AdminPhoto:
      allOf:
        - $ref: "#/components/schemas/Image"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }

    AdminBusinessListItem:
      type: object
      required: [id, slug, name, category, district, status, hasConsent, photosCount, itemsCount, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/CategoryRef" }
        district: { $ref: "#/components/schemas/DistrictRef" }
        status: { $ref: "#/components/schemas/BusinessStatus" }
        hasConsent: { type: boolean }
        photosCount: { type: integer }
        itemsCount: { type: integer }
        updatedAt: { type: string, format: date-time }

    AdminBusinessPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminBusinessListItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    AdminBusiness:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - category
        - district
        - address
        - location
        - phones
        - telegram
        - instagram
        - schedule
        - status
        - consent
        - photos
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        category: { $ref: "#/components/schemas/CategoryRef" }
        district: { $ref: "#/components/schemas/DistrictRef" }
        address:
          type: object
          required: [text, landmark]
          properties:
            text: { type: string }
            landmark: { type: [string, "null"] }
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        phones:
          type: array
          items: { $ref: "#/components/schemas/Phone" }
        telegram: { type: [string, "null"] }
        instagram: { type: [string, "null"] }
        schedule:
          oneOf:
            - $ref: "#/components/schemas/WeeklySchedule"
            - type: "null"
        status: { $ref: "#/components/schemas/BusinessStatus" }
        consent:
          oneOf:
            - $ref: "#/components/schemas/Consent"
            - type: "null"
        photos:
          type: array
          items: { $ref: "#/components/schemas/AdminPhoto" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminBusinessCreate:
      type: object
      required: [name, categorySlug, districtSlug]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        categorySlug: { type: string, description: Ichki (oxirgi darajadagi) kategoriya }
        districtSlug: { type: string }

    AdminBusinessUpdate:
      type: object
      description: Faqat yuborilgan maydonlar yangilanadi
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        categorySlug: { type: string }
        districtSlug: { type: string }
        address:
          type: object
          required: [text, landmark]
          properties:
            text: { type: string, maxLength: 300 }
            landmark: { type: [string, "null"], maxLength: 200 }
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        phones:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Phone" }
        telegram:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9_]{5,32}$"
        instagram:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9_.]{1,30}$"
        schedule:
          oneOf:
            - $ref: "#/components/schemas/WeeklySchedule"
            - type: "null"
        consent:
          oneOf:
            - $ref: "#/components/schemas/Consent"
            - type: "null"
        status: { $ref: "#/components/schemas/BusinessStatus" }

    ItemInput:
      type: object
      required: [kind, name, group, description, price, durationMinutes, attributes, isAvailable]
      properties:
        kind:
          type: string
          enum: [product, service]
        name: { type: string, minLength: 2, maxLength: 120 }
        group: { type: [string, "null"], maxLength: 60 }
        description: { type: [string, "null"], maxLength: 1000 }
        price: { $ref: "#/components/schemas/ItemPrice" }
        durationMinutes: { type: [integer, "null"], minimum: 5, maximum: 1440 }
        attributes:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string, maxLength: 40 }
              value: { type: string, maxLength: 120 }
        isAvailable: { type: boolean }

    SearchSuggestions:
      type: object
      required: [categories, businesses]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/CategoryRef" }
        businesses:
          type: array
          items:
            type: object
            required: [slug, name, categoryName]
            properties:
              slug: { type: string }
              name: { type: string }
              categoryName: { type: string }

    StatsEvent:
      type: object
      required: [type, businessId]
      properties:
        type:
          type: string
          enum: [profile_view, call_click, telegram_click, direction_click]
        businessId: { type: string, format: uuid }
