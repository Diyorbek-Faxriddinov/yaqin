        districtSlug: { type: [string, "null"] }
        address: { type: [string, "null"], maxLength: 300 }
        contactName: { type: string, minLength: 2, maxLength: 60 }
        phone: { type: string, pattern: "^\\+998\\d{9}$" }
        note: { type: [string, "null"], maxLength: 1000 }
        agree:
          type: boolean
          const: true
          description: Shaxsiy maʼlumotlarni (ism, telefon) qayta ishlashga rozilik

