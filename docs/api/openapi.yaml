        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Jurnal sahifasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/settings:
    get:
      tags: [admin]
      operationId: adminGetSettings
      summary: Platforma sozlamalari — ruxsat settings.manage
      security: [{ adminSessionCookie: [] }]
      responses:
        "200":
          description: Sozlamalar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [admin]
      operationId: adminUpdateSettings
      summary: Sozlamalarni saqlash — ruxsat settings.manage
      security: [{ adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformSettings" }
      responses:
        "200":
          description: Saqlandi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/stats:
    get:
      tags: [admin]
      operationId: adminGetStats
      summary: Platforma statistikasi — ruxsat stats.view
      security: [{ adminSessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/StatsDays"
      responses:
        "200":
          description: Statistika
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformStats" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/businesses/{businessId}/stats:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      tags: [admin]
      operationId: adminGetBusinessStats
      summary: Biznes statistikasi — ruxsat business.view
      security: [{ adminSessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/StatsDays"
      responses:
        "200":
          description: Statistika
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsSeries" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/businesses/{businessId}/report-link:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      tags: [admin]
      operationId: adminGetReportLink
      summary: Egasi uchun hisobot havolasi holati — ruxsat business.view
      description: Havolaning o'zi qaytarilmaydi (faqat xeshi saqlanadi) — yo'qolsa, yangisi yaratiladi.
      security: [{ adminSessionCookie: [] }]
      responses:
        "200":
          description: Holat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportLinkStatus" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [admin]
      operationId: adminCreateReportLink
      summary: Yangi havola — ruxsat business.edit (eskisi bekor bo'ladi)
      security: [{ adminSessionCookie: [] }]
      responses:
        "201":
          description: Token bir marta qaytariladi
          content:
            application/json:
              schema:
                type: object
                required: [token, status]
                properties:
                  token: { type: string }
                  status: { $ref: "#/components/schemas/ReportLinkStatus" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      operationId: adminRevokeReportLink
      summary: Havolani bekor qilish — ruxsat business.edit
      security: [{ adminSessionCookie: [] }]
      responses:
        "204":
          description: Bekor qilindi
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /search/suggest:
    get:
      tags: [businesses]
      operationId: searchSuggest
      summary: Qidiruv takliflari (autocomplete)
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "200":
          description: Takliflar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchSuggestions"

  /events:
    post:
      tags: [stats]
      operationId: trackEvent
      summary: Statistika hodisasi (ko'rish, qo'ng'iroq, yo'nalish bosish)
      description: Shaxsiy maʼlumot va joylashuv saqlanmaydi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsEvent"
      responses:
        "202":
          description: Qabul qilindi
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: |
        httpOnly, Secure, SameSite=Lax sessiya cookie'si. O'zgartiruvchi so'rovlar (POST/PUT/PATCH/DELETE)
        qo'shimcha ravishda `X-CSRFToken` sarlavhasini talab qiladi — qiymati `csrftoken` cookie'sidan
        (double-submit, Django CSRF bilan mos). Qarang: ADR-0012.

    adminSessionCookie:
      type: apiKey
      in: cookie
      name: adminsessionid
      description: |
        Admin sessiyasi — mijoz sessiyasidan alohida: HttpOnly, Secure, SameSite=Strict, 8 soat.
        Kirish ikki bosqichli (parol + TOTP). CSRF qoidalari sessionCookie bilan bir xil.

  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminId:
      name: adminId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatsDays:
      name: days
      in: query
      description: Davr (kun) — oxirgi N kun, bugun bilan
      schema: { type: integer, enum: [7, 30, 90], default: 30 }
    Lang:
      name: lang
      in: query
      schema:
        $ref: "#/components/schemas/Locale"
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]+$", maxLength: 120 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    NotFound:
      description: Topilmadi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Notoʻgʻri soʻrov
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Kirilmagan yoki sessiya eskirgan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Ruxsat yoʻq yoki CSRF token notoʻgʻri
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Juda ko'p urinish — keyinroq qayta urinib ko'ring
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Holat ziddiyati (masalan, sharh allaqachon mavjud)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LoggedIn:
      description: Kirildi; `sessionid` (httpOnly) va `csrftoken` cookie'lari o'rnatiladi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Me"

  schemas:
    Locale:
      type: string
      enum: [uz, ru]
      default: uz

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [not_found, validation_error]
        message:
          type: string
          description: Foydalanuvchiga koʻrsatsa boʻladigan, soʻralgan tildagi xabar
        fields:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Tiyinda (1 soʻm = 100 tiyin)
        currency:
          type: string
          enum: [UZS]

    PriceRange:
      type: object
      required: [min, max]
      properties:
        min: { $ref: "#/components/schemas/Money" }
        max: { $ref: "#/components/schemas/Money" }

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }

    Image:
      type: object
      required: [url, width, height]
      properties:
        url: { type: string, format: uri }
        width: { type: integer }
        height: { type: integer }
        alt: { type: [string, "null"] }

    CategoryRef:
      type: object
      required: [id, slug, name, iconKey]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        iconKey:
          type: [string, "null"]
          description: Frontend ikonka kaliti (shopping, food, beauty, ...)

    CategoryNode:
      allOf:
        - $ref: "#/components/schemas/CategoryRef"
        - type: object
          required: [businessCount, children]
          properties:
            businessCount:
              type: integer
              description: Ushbu kategoriya va uning ichki kategoriyalaridagi eʼlon qilingan bizneslar
            children:
              type: array
              items:
                $ref: "#/components/schemas/CategoryNode"

    AttributeDefinition:
      type: object
      required: [key, name, type, filterable]
      properties:
        key: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [text, number, boolean, select, multiselect]
        unit: { type: [string, "null"] }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
        filterable: { type: boolean }

    CategoryDetail:
      allOf:
        - $ref: "#/components/schemas/CategoryNode"
        - type: object
          required: [parent, attributes]
          properties:
            parent:
              oneOf:
                - $ref: "#/components/schemas/CategoryRef"
                - type: "null"
            attributes:
              type: array
              items:
                $ref: "#/components/schemas/AttributeDefinition"

    District:
      type: object
      required: [id, slug, name, center]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        center: { $ref: "#/components/schemas/GeoPoint" }

    DistrictRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    TimeInterval:
      type: object
      required: [open, close]
      description: |
        Mahalliy vaqt (Asia/Tashkent), "HH:MM". `close` ≤ `open` bo'lsa, interval keyingi kunga
        o'tadi (masalan 18:00–02:00). "24:00" — kun oxiri.
      properties:
        open: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        close: { type: string, pattern: "^(([01]\\d|2[0-3]):[0-5]\\d|24:00)$" }

    WeeklySchedule:
      type: object
      required: [is24x7, days]
      properties:
        is24x7: { type: boolean }
        days:
          type: array
          description: Roʻyxatda yoʻq kun — dam olish kuni
          items:
            type: object
            required: [weekday, intervals]
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
                description: ISO 8601 — 1 dushanba, 7 yakshanba
              intervals:
                type: array
                items:
                  $ref: "#/components/schemas/TimeInterval"

    RatingSummary:
      type: object
      required: [average, count]
      properties:
        average:
          type: [number, "null"]
          description: 1–5; sharh boʻlmasa null
        count: { type: integer }

    BusinessSummary:
      type: object
      required:
        - id
        - slug
        - name
        - category
        - district
        - location
        - coverImage
        - rating
        - priceRange
        - schedule
        - distanceMeters
        - isVerified
        - createdAt
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/CategoryRef" }
        district: { $ref: "#/components/schemas/DistrictRef" }
        location: { $ref: "#/components/schemas/GeoPoint" }
        coverImage:
          oneOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"
        rating: { $ref: "#/components/schemas/RatingSummary" }
        priceRange:
          oneOf:
            - $ref: "#/components/schemas/PriceRange"
            - type: "null"
        schedule:
          oneOf:
            - $ref: "#/components/schemas/WeeklySchedule"
            - type: "null"
          description: null — ish vaqti nomaʼlum
        distanceMeters:
          type: [number, "null"]
          description: Faqat lat/lng berilganda
        isVerified:
          type: boolean
          description: Platforma tomonidan joyida tekshirilgan
        createdAt: { type: string, format: date-time }

    BusinessPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BusinessSummary"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Phone:
      type: object
      required: [number]
      properties:
        number:
          type: string
          description: E.164, masalan +998901234567
        label: { type: [string, "null"] }

    BusinessDetail:
      allOf:
        - $ref: "#/components/schemas/BusinessSummary"
        - type: object
          required:
            [
              description,
              address,
              phones,
              telegram,
              instagram,
              website,
              gallery,
            ]
          properties:
            description: { type: [string, "null"] }
            address:
              type: object
              required: [text, landmark]
              properties:
                text: { type: string }
                landmark:
                  type: [string, "null"]
                  description: Moʻljal — "Chorsu bozori yonida"
            phones:
              type: array
              items: { $ref: "#/components/schemas/Phone" }
            telegram:
              type: [string, "null"]
              description: Foydalanuvchi nomi, @ siz
            instagram: { type: [string, "null"] }
            website: { type: [string, "null"], format: uri }
            gallery:
              type: array
              items: { $ref: "#/components/schemas/Image" }

    ItemPrice:
      type: object
      required: [type, min, max]
      description: |
        - fixed — aniq narx (`min`);
        - from — "... dan" (`min`);
        - range — oraliq (`min`–`max`);
        - on_request — narx so'rov bo'yicha (`min`, `max` — null).
      properties:
        type:
          type: string
          enum: [fixed, from, range, on_request]
        min:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        max:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"

    ItemAttribute:
      type: object
      required: [key, name, value]
      properties:
        key: { type: string }
        name: { type: string }
        value:
          type: string
          description: Koʻrsatish uchun tayyor qiymat ("42", "Qora, oq", "Ha")

    Item:
      type: object
      required:
        - id
        - slug
        - kind
        - name
        - group
        - description
        - price
        - durationMinutes
        - attributes
        - images
        - isAvailable
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        kind:
          type: string
          enum: [product, service]
        name: { type: string }
        group:
          type: [string, "null"]
          description: Biznes ichidagi boʻlim ("Soch turmagi", "Ichimliklar")
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/ItemPrice" }
        durationMinutes:
          type: [integer, "null"]
          description: Faqat xizmatlar uchun
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ItemAttribute" }
        images:
          type: array
          items: { $ref: "#/components/schemas/Image" }
        isAvailable:
          type: boolean
          description: Hozir mavjud / koʻrsatiladi

    Review:
      type: object
      required: [id, authorName, rating, text, createdAt, reply]
      properties:
        id: { type: string, format: uuid }
        authorName:
          type: string
          description: Koʻrsatiladigan ism (masalan "Aziz T."); toʻliq ism va kontaktlar qaytarilmaydi
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        reply:
          description: Biznes javobi
          oneOf:
            - type: object
              required: [text, createdAt]
              properties:
                text: { type: string }
                createdAt: { type: string, format: date-time }
            - type: "null"

    ReviewPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    MapMarker:
      type: object
      required: [id, slug, name, location, category, rating, schedule]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        location: { $ref: "#/components/schemas/GeoPoint" }
        category: { $ref: "#/components/schemas/CategoryRef" }
        rating: { $ref: "#/components/schemas/RatingSummary" }
        schedule:
          oneOf:
            - $ref: "#/components/schemas/WeeklySchedule"
            - type: "null"

    TelegramAuth:
      type: object
      description: Telegram Login Widget qaytaradigan maydonlar (o'zgartirilmasdan)
      required: [id, first_name, auth_date, hash]
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        username: { type: string }
        photo_url: { type: string, format: uri }
        auth_date: { type: integer }
        hash: { type: string }

    Me:
      type: object
      required: [id, displayName, avatarUrl, provider, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: [string, "null"], format: uri }
        provider:
          type: string
          enum: [telegram, google, demo]
        createdAt: { type: string, format: date-time }

    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: [string, "null"], maxLength: 1000 }

    MyReview:
      type: object
      required: [id, business, rating, text, status, rejectionReason, createdAt]
      properties:
        id: { type: string, format: uuid }
        business:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ReviewStatus" }
        rejectionReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    ComplaintReason:
      type: string
      enum:
        [
          wrong_info,
          closed_permanently,
          wrong_location,
          fake_reviews,
          fraud,
          other,
        ]

    ComplaintInput:
      type: object
      required: [businessId, reason]
      properties:
        businessId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ComplaintReason" }
        text:
          type: [string, "null"]
          maxLength: 1000
          description: "`other` uchun majburiy (kamida 10 belgi)"

    Complaint:
      type: object
      required: [id, business, reason, text, status, resolutionNote, createdAt]
      properties:
        id: { type: string, format: uuid }
        business:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        reason: { $ref: "#/components/schemas/ComplaintReason" }
        text: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ComplaintStatus" }
        resolutionNote: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    AdminPermission:
      type: string
      description: Atomar ruxsat (ADR-0009). Root barcha ruxsatlarga ega.
      enum:
        - business.view
        - business.edit
        - business.publish
        - category.manage
        - review.moderate
        - complaint.manage
        - user.view
        - user.manage
        - staff.manage
        - audit.view
        - settings.manage
        - stats.view

    AdminMe:
      type: object
      required: [id, username, displayName, isRoot, permissions]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        isRoot: { type: boolean }
        permissions:
          type: array
          description: Amaldagi (rollar va alohida ruxsatlardan hisoblangan) ruxsatlar
          items: { $ref: "#/components/schemas/AdminPermission" }

    BusinessStatus:
      type: string
      description: draft — qoralama (saytda yo'q), published — e'lon qilingan, hidden — vaqtincha yashirilgan
      enum: [draft, published, hidden]

    Consent:
      type: object
      required: [givenBy, givenAt, note]
      description: Biznes egasining maʼlumotlarni e'lon qilishga roziligi (ADR-0007)
      properties:
        givenBy:
          {
            type: string,
            maxLength: 100,
            description: Kim rozilik berdi (ism,
            lavozim),
          }
        givenAt: { type: string, format: date-time }
        note: { type: [string, "null"], maxLength: 500 }

    AdminPhoto:
      allOf:
        - $ref: "#/components/schemas/Image"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }

    AdminBusinessListItem:
      type: object
      required:
        [
          id,
          slug,
          name,
          category,
          district,
          status,
          hasConsent,
          photosCount,
          itemsCount,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/CategoryRef" }
        district: { $ref: "#/components/schemas/DistrictRef" }
        status: { $ref: "#/components/schemas/BusinessStatus" }
        hasConsent: { type: boolean }
        photosCount: { type: integer }
        itemsCount: { type: integer }
        updatedAt: { type: string, format: date-time }

    AdminBusinessPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminBusinessListItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    AdminBusiness:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - category
        - district
        - address
        - location
        - phones
        - telegram
        - instagram
        - schedule
        - status
        - consent
        - photos
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        category: { $ref: "#/components/schemas/CategoryRef" }
        district: { $ref: "#/components/schemas/DistrictRef" }
        address:
          type: object
          required: [text, landmark]
          properties:
            text: { type: string }
