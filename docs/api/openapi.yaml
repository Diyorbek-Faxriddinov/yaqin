      type: object
      required: [permission, sources]
      description: Amaldagi ruxsat va uning manbalari (ADR-0009, 4-qoida)
      properties:
        permission: { $ref: "#/components/schemas/AdminPermission" }
        sources:
          type: array
          items:
            oneOf:
              - type: object
                required: [type, role]
                properties:
                  type: { type: string, const: role }
                  role: { $ref: "#/components/schemas/AdminRoleRef" }
              - type: object
                required: [type]
                properties:
                  type: { type: string, const: direct }

    AdminStaff:
      type: object
      required:
        - id
