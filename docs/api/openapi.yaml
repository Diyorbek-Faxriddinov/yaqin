        - displayName
        - isRoot
        - isActive
        - roles
        - extraPermissions
        - effectivePermissions
        - lastLoginAt
        - createdAt
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        isRoot: { type: boolean }
        isActive: { type: boolean }
        roles:
          type: array
          items: { $ref: "#/components/schemas/AdminRoleRef" }
        extraPermissions:
          type: array
          description: Roldan tashqari alohida berilgan ruxsatlar
          items: { $ref: "#/components/schemas/AdminPermission" }
        effectivePermissions:
          type: array
          items: { $ref: "#/components/schemas/EffectivePermission" }
        lastLoginAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    AdminStaffCreate:
      type: object
      required: [username, displayName, roleIds, extraPermissions]
      properties:
        username: { type: string, pattern: "^[a-z][a-z0-9_.-]{2,31}$" }
        displayName: { type: string, minLength: 2, maxLength: 60 }
        roleIds:
          type: array
          items: { type: string, format: uuid }
        extraPermissions:
          type: array
          items: { $ref: "#/components/schemas/AdminPermission" }

    AdminStaffUpdate:
      type: object
      properties:
