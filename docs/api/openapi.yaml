      tags: [admin]
      operationId: adminSetCategoryAttributes
      summary: Ichki kategoriya atributlari (butun ro'yxat almashtiriladi) — ruxsat category.manage
      description: |
        Atributlar — shu kategoriyadagi mahsulot/xizmatlar uchun tavsiya etilgan xususiyatlar
        (o'lcham, kafolat muddati...). Katalog formasida tayyor maydon sifatida taklif qilinadi.
      security: [{ adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attributes]
              properties:
                attributes:
                  type: array
                  maxItems: 20
                  items: { $ref: "#/components/schemas/AdminAttribute" }
      responses:
        "200":
          description: Saqlandi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategory" }
