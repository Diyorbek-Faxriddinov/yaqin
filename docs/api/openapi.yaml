          { type: string, description: Ichki (oxirgi darajadagi) kategoriya }
        districtSlug: { type: string }

    AdminBusinessUpdate:
      type: object
      description: Faqat yuborilgan maydonlar yangilanadi
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        categorySlug: { type: string }
        districtSlug: { type: string }
        address:
          type: object
          required: [text, landmark]
          properties:
            text: { type: string, maxLength: 300 }
            landmark: { type: [string, "null"], maxLength: 200 }
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        phones:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Phone" }
        telegram:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9_]{5,32}$"
        instagram:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9_.]{1,30}$"
        schedule:
          oneOf:
            - $ref: "#/components/schemas/WeeklySchedule"
            - type: "null"
        consent:
          oneOf:
            - $ref: "#/components/schemas/Consent"
            - type: "null"
        status: { $ref: "#/components/schemas/BusinessStatus" }

    ItemInput:
      type: object
      required:
        [
          kind,
          name,
          group,
          description,
          price,
          durationMinutes,
          attributes,
          isAvailable,
        ]
      properties:
        kind:
          type: string
          enum: [product, service]
        name: { type: string, minLength: 2, maxLength: 120 }
        group: { type: [string, "null"], maxLength: 60 }
        description: { type: [string, "null"], maxLength: 1000 }
        price: { $ref: "#/components/schemas/ItemPrice" }
        durationMinutes: { type: [integer, "null"], minimum: 5, maximum: 1440 }
        attributes:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string, maxLength: 40 }
              value: { type: string, maxLength: 120 }
        isAvailable: { type: boolean }

    SearchSuggestions:
      type: object
      required: [categories, businesses]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/CategoryRef" }
        businesses:
          type: array
          items:
            type: object
            required: [slug, name, categoryName]
            properties:
              slug: { type: string }
              name: { type: string }
              categoryName: { type: string }

    StatsEvent:
      type: object
      required: [type, businessId]
      properties:
        type:
          type: string
          enum: [profile_view, call_click, telegram_click, direction_click]
        businessId: { type: string, format: uuid }

    LocalizedText:
      type: object
      required: [uz, ru]
      description: Ikki tildagi matn (kategoriya nomlari uchun server kamida 2 belgi talab qiladi)
      properties:
        uz: { type: string, minLength: 1, maxLength: 60 }
        ru: { type: string, minLength: 1, maxLength: 60 }

    CategoryIconKey:
      type: string
      description: Frontend ikonka kaliti (yuqori darajadagi kategoriyalar uchun)
      enum:
        - shopping
        - food
        - beauty
        - home-services
        - auto
        - health
        - education
        - sport
        - travel
        - events
        - pets
        - professional

    AttributeOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string, pattern: "^[a-z0-9_-]{1,40}$" }
        label: { $ref: "#/components/schemas/LocalizedText" }

    AdminAttribute:
      type: object
      required: [key, name, type, unit, options, filterable]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$" }
        name: { $ref: "#/components/schemas/LocalizedText" }
        type:
          type: string
          enum: [text, number, boolean, select, multiselect]
        unit:
          type: [string, "null"]
          maxLength: 20
          description: Faqat number uchun ("oy", "g")
        options:
          type: array
          maxItems: 30
          description: select va multiselect uchun (kamida 2 ta), boshqalarida bo'sh
          items: { $ref: "#/components/schemas/AttributeOption" }
        filterable:
          type: boolean
          description: Kelajakda ommaviy filtrlar uchun (hozircha interfeysda ishlatilmaydi)

    AdminCategory:
      type: object
      required: [id, slug, name, iconKey, parentId, businessCount, attributes]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { $ref: "#/components/schemas/LocalizedText" }
        iconKey:
          oneOf:
            - $ref: "#/components/schemas/CategoryIconKey"
            - type: "null"
        parentId: { type: [string, "null"], format: uuid }
        businessCount:
          type: integer
          description: Barcha holatdagi bizneslar (ichki kategoriyalari bilan)
        attributes:
          type: array
          items: { $ref: "#/components/schemas/AdminAttribute" }

    AdminCategoryCreate:
      type: object
      required: [slug, name, parentId]
      properties:
        slug:
          {
            type: string,
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$",
            minLength: 2,
            maxLength: 60,
          }
        name: { $ref: "#/components/schemas/LocalizedText" }
        parentId: { type: [string, "null"], format: uuid }
        iconKey: { $ref: "#/components/schemas/CategoryIconKey" }

    AdminCategoryUpdate:
      type: object
      properties:
        name: { $ref: "#/components/schemas/LocalizedText" }
        iconKey: { $ref: "#/components/schemas/CategoryIconKey" }

    AdminBusinessRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }

    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    ReviewStatus:
      type: string
