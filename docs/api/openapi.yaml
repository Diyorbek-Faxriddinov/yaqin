        status: { $ref: "#/components/schemas/ComplaintStatus" }
        resolutionNote: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminComplaintPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminComplaint" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    BusinessRequestInput:
      type: object
      required: [businessName, contactName, phone, agree]
