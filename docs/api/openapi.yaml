      security: [{ adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCategoryUpdate" }
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategory" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      operationId: adminDeleteCategory
      summary: Kategoriyani o'chirish — ruxsat category.manage
      description: Faqat bo'sh kategoriya (biznes ham, ichki kategoriya ham yo'q) — aks holda 409.
      security: [{ adminSessionCookie: [] }]
      responses:
        "204":
          description: O'chirildi
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/categories/{categoryId}/attributes:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
